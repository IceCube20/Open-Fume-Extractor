name: Publish firmware release assets

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "flasher/firmware-catalog.json"
      - ".github/workflows/release-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read master release version
        id: release
        shell: bash
        run: |
          version="$(jq -r '.[] | select(.signatureTarget == "MASTER") | .version' flasher/firmware-catalog.json)"
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Master version is missing from firmware-catalog.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag exists
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --tags --force
          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Open Fume Extractor ${{ steps.release.outputs.version }}"
            git push origin "$RELEASE_TAG"
          fi

      - name: Prepare release notes
        id: notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          notes="docs/RELEASE-$RELEASE_VERSION.md"
          if [[ ! -f "$notes" ]]; then
            notes="$RUNNER_TEMP/ofe-release-notes.md"
            printf '%s\n' 'Signed OTA packages and complete merged USB images.' '' 'Use normal .bin files for OTA; use *-merged.bin only for initial USB flashing at 0x0.' > "$notes"
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish signed and merged firmware files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Open Fume Extractor ${{ steps.release.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: firmware/**/*.bin
